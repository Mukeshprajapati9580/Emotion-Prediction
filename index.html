<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emotion Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <header class="top">
      <h1>Emotion Reader</h1>
      <p class="sub">Write a sentence and see which of six emotions it carries.</p>
      <span class="status" id="status" title="Server status"><i></i><b>Checking server…</b></span>
    </header>

    <div class="grid">
      <section class="card input" aria-labelledby="inLabel">
        <label id="inLabel" for="text">Your text</label>
        <textarea id="text" maxlength="2000" rows="7" placeholder="I feel so happy and excited about tomorrow"></textarea>
        <div class="row">
          <span class="count"><span id="count">0</span> / 2000</span>
          <div class="actions">
            <button type="button" class="ghost" id="clear">Clear</button>
            <button type="button" class="primary" id="go">Analyze emotion</button>
          </div>
        </div>
        <div class="examples">
          <span>Try an example</span>
          <button type="button" class="chip">I can't stop smiling, today was perfect</button>
          <button type="button" class="chip">I miss her so much it hurts</button>
          <button type="button" class="chip">How dare you talk to me like that</button>
          <button type="button" class="chip">I'm terrified of what's behind that door</button>
          <button type="button" class="chip">I never expected this gift, wow</button>
          <button type="button" class="chip">I adore you more every single day</button>
        </div>
      </section>

      <section class="card result" id="result" aria-live="polite" data-state="empty">
        <div class="state empty">
          <div class="ghost-face">🙂</div>
          <p>Your result will appear here.</p>
        </div>
        <div class="state loading">
          <div class="spinner"></div>
          <p>Reading your text…</p>
        </div>
        <div class="state error">
          <p class="err-title">Couldn't get a prediction</p>
          <p id="errMsg"></p>
          <button type="button" class="ghost" id="retry">Try again</button>
        </div>
        <div class="state done">
          <div class="hero">
            <div class="emoji" id="emoji"></div>
            <div>
              <h2 id="label"></h2>
              <p class="conf"><b id="conf"></b> confident</p>
            </div>
          </div>
          <p class="quote" id="quote"></p>
          <ul class="bars" id="bars"></ul>
        </div>
      </section>
    </div>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
